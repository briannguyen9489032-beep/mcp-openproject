[package]
name = "mcp-openproject"
version = "0.1.0"
edition = "2021"
description = "Fast, context-frugal OpenProject Community Edition MCP server in Rust with preview-then-confirm guarded writes for Orca agents."
license = "MIT"
authors = ["IvanHa-dev"]

[[bin]]
name = "mcp-openproject"
path = "rust/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
